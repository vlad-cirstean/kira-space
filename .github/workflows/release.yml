name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*.*.*']
  # release-on-merge.yml dispatches this; a tag it creates with GITHUB_TOKEN starts no workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, vX.Y.Z
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# P330 graph: `tag` resolves the tag to a commit (seconds); build (macOS), test-matrix and both
# db-compat halves then start together at that commit; only publish waits for all of them. After
# publish, install-smoke runs the published installer on a clean macOS runner. publish
# creates a draft, verifies both assets, then publishes in one API call, so a failed job leaves no
# release and no half-uploaded one is ever visible. No job here saves a cache: cache-warm.yml owns
# main's caches, and every job here restores them.
# P331: `tag` refuses an already-published release and a non-prerelease tag off main before any
# runner starts; publish refuses a tag that moved after `tag` resolved it.
jobs:
  # The one place the tag is read: every later job checks out this commit and uses this name.
  tag:
    name: resolve tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "bad tag '$TAG'" >&2; exit 1; }
          read -r TYPE SHA <<EOF
          $(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          EOF
          if [ "$TYPE" = tag ]; then SHA="$(gh api "repos/$GH_REPO/git/tags/$SHA" --jq .object.sha)"; fi
          printf '%s\n' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "tag $TAG resolved to '$SHA'" >&2; exit 1; }
          if gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .draft 2>/dev/null | grep -qx false; then
            echo "release $TAG is already published; not overwriting" >&2
            exit 1
          fi
          # Replaces the dropped PR CI wait: main takes only PR merges, so a main commit passed PR CI.
          case "$TAG" in
            *-*) echo "prerelease $TAG: main ancestry not required" ;;
            *)
              STATUS="$(gh api "repos/$GH_REPO/compare/$SHA...main" --jq .status)"
              case "$STATUS" in
                ahead | identical) ;;
                *) echo "tag $TAG at $SHA is not on main (compare: $STATUS); only a merged commit ships" >&2; exit 1 ;;
              esac
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "releasing $TAG at $SHA"

  # Packages the one app. Signing is ad-hoc only (docs/PACKAGING.md §6), so there is no notarisation wait.
  build:
    name: build (macOS)
    needs: tag
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      space-sha256: ${{ steps.sums.outputs.space }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}

      # P119: the tag versions the app. build/config.yml's info.version is the one place the build
      # reads a version; from there it is linked into the binary and stamped into Info.plist, and
      # verify:packaging's A5 asserts the bundle carries it.
      - name: Set the app version from the release tag
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -eu
          TAG="${RELEASE_TAG#v}"
          printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "bad version '$TAG'" >&2; exit 1; }
          CONFIG=apps/kira-space/build/config.yml
          perl -i -pe 's/^(  version: )"[^"]*"/$1"'"$TAG"'"/' "$CONFIG"
          test "$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' "$CONFIG" | head -1)" = "$TAG"
          echo "$CONFIG version set to $TAG"

      # Restores main's bun, wails3 and bindings entries; saves nothing. Also runs scripts/setup.sh.
      - uses: ./.github/actions/setup
        with:
          cache-save: "false"

      - run: bun run package

      # P10: `package` already produced and signed the .dmg — this only gives it the
      # platform-qualified name its release asset carries. scripts/install.sh downloads this exact
      # name, so renaming it breaks install and update.
      - name: Name the signed disk image for distribution
        run: cp "apps/kira-space/bin/Kira Space.dmg" "kira-space-macos-arm64.dmg"

      # The bundle exists now, so every artifact check runs instead of skipping.
      - name: Verify packaging
        run: bun run verify:packaging

      - name: Assert packaged bundle and disk image (docs/PACKAGING.md §4 — checks the actual tagged release build)
        run: |
          set -eu
          assert_app() {
            APP="$1/bin/$2.app"
            DMG="$1/bin/$2.dmg"
            MNT="$4"
            test -d "$APP"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "$3"
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -q 'Signature=adhoc'
            # The installer mounts this image and copies the app out of it, so this opens the real
            # thing: the image mounts and the app is inside it.
            test -f "$DMG"
            codesign -dv --verbose=2 "$DMG" 2>&1 | grep -q 'Signature=adhoc'
            hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
            test -d "$MNT/$2.app"
            test -L "$MNT/Applications"
            hdiutil detach "$MNT"
            du -sh "$APP" "$DMG"
          }
          assert_app apps/kira-space "Kira Space" com.kirathecat.kira-space /tmp/kira-space-dmg

      - name: Hash the disk image
        id: sums
        run: |
          echo "space=$(shasum -a 256 kira-space-macos-arm64.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-dmgs
          path: kira-space-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 14

  # Full adapter auth/config permutation matrix (P25/P26). pr.yml never sets KIRA_TEST_MATRIX, so a
  # release is the only CI entry point for it. Restores main's go-ct build cache, saves nothing.
  test-matrix:
    name: test-matrix (Linux)
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - uses: ./.github/actions/setup
        with:
          bun: "false"
          bindings: "false"
          go-cache: go-ct
          gtk: "true"
          cache-save: "false"
      - run: sh scripts/test-matrix.sh --mirror

  # Per-adapter conformance against each kind's oldest and newest supported server (P16). pr.yml
  # never sets KIRA_COMPAT_IMAGE_*. min and max run as two parallel jobs.
  db-compat:
    name: db-compat (Linux, ${{ matrix.extreme }})
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        extreme: [min, max]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - uses: ./.github/actions/setup
        with:
          bun: "false"
          bindings: "false"
          go-cache: go-ct
          gtk: "true"
          cache-save: "false"
      - run: sh scripts/db-compat.sh --${{ matrix.extreme }} --mirror

  # Draft, upload, verify, publish. Skipped whenever any gate fails.
  publish:
    name: publish
    needs: [tag, build, test-matrix, db-compat]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      # A rerun of failed jobs reuses `tag`'s outputs; a tag moved since then would get the old build.
      - name: Refuse a tag that moved after this run resolved it
        env:
          SHA: ${{ needs.tag.outputs.sha }}
        run: |
          set -eu
          read -r TYPE NOW <<EOF
          $(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          EOF
          if [ "$TYPE" = tag ]; then NOW="$(gh api "repos/$GH_REPO/git/tags/$NOW" --jq .object.sha)"; fi
          if [ "$NOW" != "$SHA" ]; then
            echo "tag $TAG moved from $SHA to $NOW after this run started; start a new run: gh workflow run release.yml -f tag=$TAG" >&2
            exit 1
          fi
      - name: Download the disk image and check its hash
        env:
          SPACE_SHA: ${{ needs.build.outputs.space-sha256 }}
        run: |
          set -eu
          gh run download "$GITHUB_RUN_ID" --name release-dmgs
          test "$(sha256sum kira-space-macos-arm64.dmg | awk '{print $1}')" = "$SPACE_SHA"

      - name: Refuse an existing release, clear a leftover draft
        run: |
          set -eu
          if gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.draft' 2>/dev/null | grep -qx false; then
            echo "release $TAG is already published; not overwriting" >&2
            exit 1
          fi
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | while read -r id; do
            echo "deleting leftover draft $id"
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done

      - name: Compose release notes
        run: |
          cat > release-notes.md <<'EOF'
          Requires macOS 14 or later on Apple Silicon (arm64). Background: docs/PACKAGING.md and
          README.md.

          This release carries one app, **Kira Space**: git, coding agents, databases, API client,
          Docker and Kubernetes in one window. It replaces Kira Studio.

          ## Install or update

          Run in Terminal — the same command installs a fresh copy or replaces an older one, then
          opens the app:

          ```
          curl -fsSL https://raw.githubusercontent.com/vlad-cirstean/kira-studio/main/scripts/install.sh | sh -s -- --app=space
          ```

          Coming from Kira Studio, the old app's own update offer runs the same installer with
          `--app=studio`: it installs Kira Space, then moves Kira Studio.app to the Trash. Your data
          in `~/.kira-studio` folds into `~/.kira-space` on first launch (backup kept).
          Config files move into `~/.kira-space/config/` (backup kept).

          This is the only supported install method. These builds aren't signed by Apple; a disk
          image downloaded through a browser is blocked by Gatekeeper, while the installer's own
          download is not. The disk images attached below are what the installer downloads.

          ## Updating from inside the app

          The app checks for a newer release and offers an update. Clicking **Update** runs the
          same installer, quits the app, and reopens the new version. Nothing installs without
          that click. Installer log: `~/Library/Logs/<app name>/install.log`.
          EOF

      - name: Create the draft release with both disk images
        run: |
          set -eu
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" \
            --draft --verify-tag $PRE \
            --title "Kira Space $TAG" \
            --notes-file release-notes.md \
            kira-space-macos-arm64.dmg
          ID="$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -1)"
          test -n "$ID"
          echo "RELEASE_ID=$ID" >> "$GITHUB_ENV"

      - name: Verify the uploaded assets
        run: |
          set -eu
          want_names="kira-space-macos-arm64.dmg"
          # install.sh checks each asset's size and sha256 digest; wait for the digest to appear.
          n=0
          while :; do
            gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" > assets.json
            if jq -e 'length == 1 and all(.[]; .state == "uploaded" and .digest != null)' assets.json >/dev/null; then
              break
            fi
            n=$((n + 1))
            if [ "$n" -ge 12 ]; then
              echo "assets not uploaded with a digest after 60s:" >&2
              cat assets.json >&2
              exit 1
            fi
            sleep 5
          done
          test "$(jq -r '[.[].name] | sort | join(" ")' assets.json)" = "$want_names"
          for f in $want_names; do
            size="$(wc -c < "$f" | tr -d ' ')"
            sum="$(sha256sum "$f" | awk '{print $1}')"
            jq -e --arg n "$f" --argjson s "$size" --arg d "sha256:$sum" \
              '.[] | select(.name == $n and .size == $s and .digest == $d)' assets.json >/dev/null \
              || { echo "asset $f does not match the local file" >&2; exit 1; }
          done

      - name: Publish
        run: |
          set -eu
          LATEST="-f make_latest=true"
          case "$TAG" in *-*) LATEST="" ;; esac
          # shellcheck disable=SC2086
          gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false $LATEST
          test "$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.draft')" = false

      - name: Delete the draft after a failure
        if: failure() && env.RELEASE_ID != ''
        run: |
          if [ "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.draft' 2>/dev/null)" = true ]; then
            gh api -X DELETE "repos/$GH_REPO/releases/$RELEASE_ID"
          fi

  # The published installer on a clean macOS runner, both entry points. `--app=space` installs
  # Kira Space. `--app=studio` is the old Kira Studio updater's path: it installs Kira Space, moves
  # a stand-in Kira Studio.app to the Trash and leaves ~/.kira-studio alone. Runs after publish
  # because the installer downloads the latest published release.
  install-smoke:
    name: install smoke (macOS)
    needs: [tag, publish]
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - name: Install with --app=space
        run: |
          set -eu
          sh scripts/install.sh --app=space
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "/Applications/Kira Space.app/Contents/Info.plist")" = com.kirathecat.kira-space
          codesign --verify --deep --strict "/Applications/Kira Space.app"
          pkill -x "Kira Space" || true; sleep 3
      - name: Install with --app=studio over a stand-in Kira Studio.app
        run: |
          set -eu
          OLD="/Applications/Kira Studio.app"
          mkdir -p "$OLD/Contents/MacOS" "$HOME/.kira-studio"
          printf 'keep' > "$HOME/.kira-studio/marker"
          cat > "$OLD/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>com.kirathecat.kira-studio</string>
          <key>CFBundleName</key><string>Kira Studio</string>
          </dict></plist>
          EOF
          sh scripts/install.sh --app=studio
          test ! -e "$OLD"
          ls "$HOME/.Trash" | grep -q '^Kira Studio'
          test "$(cat "$HOME/.kira-studio/marker")" = keep
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "/Applications/Kira Space.app/Contents/Info.plist")" = com.kirathecat.kira-space
          pkill -x "Kira Space" || true; sleep 3
