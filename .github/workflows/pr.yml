name: PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

# Only the aggregates `needs` (each its own matrix job); every other job starts at once.
# Shared setup lives in .github/actions/setup.
jobs:
  # Only the work that genuinely needs macOS: cgo-aware go vet/build (catches darwin build-tag
  # breaks) and the darwin&&cgo-only test packages.
  checks:
    name: checks (macOS)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          go-cache: macos
      - name: Build frontend bundle (main.go's `//go:embed all:frontend/dist` needs this directory to exist before Go can compile the root package)
        run: bun run build
      - name: Cache golangci-lint binary (keyed on the install script, which pins the version, and go.mod, which pins the toolchain it's built against)
        uses: actions/cache@v6
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('scripts/install-golangci-lint.sh', 'go.mod') }}
      - run: bun run lint:go
      - name: Go compile check, every package (darwin build-tag breaks caught here even though the test run below is scoped)
        run: go build ./...
      - name: Go unit tests, darwin-relevant packages only (secrets, metrics, localauth, imageclip, gitclient, datagrip have darwin&&cgo files; the Linux jobs run every other package)
        run: |
          go test \
            ./internal/secrets/... \
            ./internal/metrics/... \
            ./apps/kira-space/internal/localauth/... \
            ./apps/kira-space/internal/gitclient \
            ./apps/kira-space/internal/datagrip/...
          go test -tags imagecliptest ./apps/kira-space/internal/imageclip/...

  # Lint, typecheck, frontend builds, lint:dead, verify:packaging and the bun unit tests: nothing
  # here touches cgo or darwin build tags.
  checks-linux:
    name: checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          go-cache: checks
          gtk: "true"
      - run: bun run lint
      - name: Cache tsbuildinfo (tsc and vue-tsc incremental mode key on file content hashes, so a fresh checkout reuses entries)
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/tsbuildinfo
          key: tsbuildinfo-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ hashFiles('bun.lock') }}-
      - run: bun run typecheck
      - run: bun run build
      - run: bun run lint:dead
      - run: bun run verify:packaging
      - run: bun run test:unit

  # Playwright `ui` project of the one config, in 8 shards over one test build.
  # fail-fast off: a red shard must not hide the others.
  ui-shard:
    name: ui (Linux, shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - name: Cache Playwright browsers (keyed on the lockfile, which pins the @playwright/test version)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ hashFiles('bun.lock') }}
      - name: Install WebKit with its system libraries
        run: sh scripts/retry.sh 2 180 sh scripts/playwright-install.sh webkit
        timeout-minutes: 7
      - run: bun run build:test
      - run: bunx playwright test --config=apps/kira-space/playwright.config.ts --project=ui --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-ui-${{ matrix.shard }}
          path: |
            test-results/
            apps/kira-space/test-results/
          retention-days: 7

  # One stable required-check name over the shards. Fails unless every shard passed.
  ui:
    name: ui (Linux)
    needs: ui-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.ui-shard.result }}
        run: |
          echo "ui shards: $RESULT"
          test "$RESULT" = success

  # ipc-frontend (chromium), real-clipboard grid copy (chromium), then ui-timing alone on an idle
  # machine. `--no-deps` skips the `ui` project that ui-timing depends on in local runs.
  ui-extra:
    name: ui-extra (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - name: Cache Playwright browsers (keyed on the lockfile, which pins the @playwright/test version)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-chromium-${{ hashFiles('bun.lock') }}
      - name: Install WebKit and Chromium with their system libraries
        run: sh scripts/retry.sh 2 240 sh scripts/playwright-install.sh webkit chromium
        timeout-minutes: 9
      - run: bun run build:test
      - name: IPC frontend tests (consume the fixtures internal/adapters/*'s own suites generate)
        run: bunx playwright test --config=apps/kira-space/playwright.config.ts --project=ipc-frontend
      - name: Real-clipboard grid copy tests (Chromium; the same spec runs in `ui` on WebKit)
        run: bunx playwright test --config=apps/kira-space/playwright.config.ts --project=ui-clipboard
      - name: Wall-clock budget tests (alone, no other browser contending for the CPU)
        run: bunx playwright test --config=apps/kira-space/playwright.config.ts --project=ui-timing --no-deps
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-extra
          path: |
            test-results/
            apps/kira-space/test-results/
          retention-days: 7

  # Visual regression (webkit), Space and Studio-module baselines. Baselines are only ever captured
  # from this environment (tests/visual/studio/README.md).
  visual:
    name: visual (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          visual-fonts: "true"
      - name: Cache Playwright browsers (keyed on the lockfile, which pins the @playwright/test version)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ hashFiles('bun.lock') }}
      - name: Install WebKit with its system libraries
        run: sh scripts/retry.sh 2 180 sh scripts/playwright-install.sh webkit
        timeout-minutes: 7
      - run: bun run build:test
      - run: bunx playwright test --config=apps/kira-space/playwright.config.ts --project=visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-visual
          path: |
            test-results/
            apps/kira-space/test-results/
          retention-days: 7

  # Go packages that start no container, plus every package the container split does not name.
  go:
    name: go (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          go-cache: go-rest
          gtk: "true"
      - name: Give git a global author identity (gitsession exercises production code that shells out to real git commit-creating commands through gitclient's own exec runner, which never sets GIT_AUTHOR_*/GIT_COMMITTER_* itself; a fresh runner has none)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@kira-studio.test"
      - name: Raise the inotify instance limit (internal/gitsession runs t.Parallel(); each open repo holds one inotify instance, and Ubuntu's stock 128 can hang the parallel suite)
        run: sudo sysctl -w fs.inotify.max_user_instances=8192
      - name: Build frontend bundles (the root main package embeds frontend/dist)
        run: bun run build
      - run: bun run test:go:rest

  # Go packages that start Testcontainers. No bun, bindings or real frontend build: these
  # packages never link the root main packages that embed frontend/dist.
  go-containers:
    name: go-containers (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Placeholder frontend/dist (go list ./... in scripts/go-test-split.sh enumerates every package in the module, including the root main — their `//go:embed` directives fail the whole listing if the directories don't exist at all, even though nothing here imports or tests those packages)
        run: |
          mkdir -p apps/kira-space/frontend/dist apps/kira-space/frontend/dist-mobile
          touch apps/kira-space/frontend/dist/.keep apps/kira-space/frontend/dist-mobile/.keep
      - name: Restore cached Testcontainers images (keyed on the pinned image tags, so an unchanged adapter-test image set skips re-pulling)
        id: docker-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/docker-images.tar
          key: docker-${{ runner.os }}-${{ hashFiles('apps/kira-space/internal/adapters/testsupport/*.go') }}
      - name: Load the cached images in the background (overlaps setup and the test compile)
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          nohup docker load -i ~/docker-images.tar > "$RUNNER_TEMP/images.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/images.pid"
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          bun: "false"
          bindings: "false"
          go-cache: go-ct
          gtk: "true"
      - name: Pull the images in parallel on a cache miss (mirror.gcr.io avoids Docker Hub rate limits on shared runner IPs)
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          nohup sh scripts/pull-test-images.sh > "$RUNNER_TEMP/images.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/images.pid"
      - name: Give git a global author identity (see the go job)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@kira-studio.test"
      - name: Raise the inotify instance limit (see the go job)
        run: sudo sysctl -w fs.inotify.max_user_instances=8192
      - name: Wait for the images
        timeout-minutes: 10
        run: |
          while kill -0 "$(cat "$RUNNER_TEMP/images.pid")" 2>/dev/null; do sleep 2; done
          cat "$RUNNER_TEMP/images.log"
      - name: Go adapter and Docker flow tests against real Testcontainers
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: sh scripts/go-test-split.sh containers
      - name: Save pulled Testcontainers images (always() so a partial pull from a failed run still seeds the next one)
        if: always() && steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          # shellcheck disable=SC2046
          docker save $(docker images --filter dangling=false --format '{{.Repository}}:{{.Tag}}') -o ~/docker-images.tar
      - name: Cache pulled Testcontainers images
        if: always() && steps.docker-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/docker-images.tar
          key: docker-${{ runner.os }}-${{ hashFiles('apps/kira-space/internal/adapters/testsupport/*.go') }}

  # Complete auth/config permutation matrix (P25/P26) on every PR (P614), one job per weight group
  # (P608). `rest` is every kind the three heavy groups do not name, so a new adapter lands there
  # without a workflow edit. test-matrix.sh sets KIRA_TEST_MATRIX itself.
  test-matrix-group:
    name: test-matrix (Linux, ${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: postgres
            args: --only postgres
          - group: mysqlfamily
            args: --only mysqlfamily
          - group: clickhouse
            args: --only clickhouse
          - group: rest
            args: --except postgres,mysqlfamily,clickhouse
    steps:
      # test-matrix.sh gives each package min(8m, time left - 1m) of this deadline.
      - name: Job deadline for the matrix script
        run: echo "MATRIX_DEADLINE=$(( $(date +%s) + 12 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          bun: "false"
          bindings: "false"
          go-cache: go-ct
          gtk: "true"
          cache-save: "false"
      - name: Resolve this group's images (the cache key is their exact pinned tags)
        id: images
        run: |
          set -eu
          LIST="$(sh scripts/test-matrix.sh ${{ matrix.args }} --print-images)"
          printf '%s\n' "$LIST"
          echo "key=matrix-images-${{ runner.os }}-${{ matrix.group }}-$(printf '%s\n' "$LIST" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore this group's images (saved in main's scope by cache-warm.yml)
        id: image-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/matrix-images.tar
          key: ${{ steps.images.outputs.key }}
      - name: Load the cached images
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/matrix-images.tar
      - name: Complete matrix for this group (a cache miss pulls through mirror.gcr.io)
        env:
          # The runner is discarded: no reaper, no Docker Hub pull for it.
          TESTCONTAINERS_RYUK_DISABLED: "true"
          PULL: ${{ steps.image-cache.outputs.cache-hit == 'true' && '--no-pull' || '--mirror' }}
        run: sh scripts/test-matrix.sh ${{ matrix.args }} $PULL

  # One stable required-check name over the groups. Fails unless every group passed.
  test-matrix:
    name: test-matrix (Linux)
    needs: test-matrix-group
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.test-matrix-group.result }}
        run: |
          echo "test-matrix groups: $RESULT"
          test "$RESULT" = success

  # Conformance against each kind's oldest and newest supported server (P16) on every PR (P614).
  # No image cache: the compat images (about 12 GB) would push the repo past its 10 GB cache limit.
  db-compat-extreme:
    name: db-compat (Linux, ${{ matrix.extreme }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        extreme: [min, max]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          bun: "false"
          bindings: "false"
          go-cache: go-ct
          gtk: "true"
          cache-save: "false"
      - env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: sh scripts/db-compat.sh --${{ matrix.extreme }} --mirror

  # One stable required-check name over min and max. Fails unless both passed.
  db-compat:
    name: db-compat (Linux)
    needs: db-compat-extreme
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.db-compat-extreme.result }}
        run: |
          echo "db-compat extremes: $RESULT"
          test "$RESULT" = success
