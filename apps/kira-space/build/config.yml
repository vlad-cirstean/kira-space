# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Kira the Cat" # The name of the company
  productName: "Kira Space" # The name of the application
  productIdentifier: "com.kirathecat.kira-space"
  description: "Native macOS workbench: git, coding agents, databases, APIs, Docker and Kubernetes" # The application description
  copyright: "(c) 2026, Kira the Cat" # Copyright text
  comments: "Kira Space — a native workbench for macOS" # Comments
  version: "0.0.0" # The application version
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car icon bundles (optional)
  #                               # Should match the name of your .icon file without the extension
  #                               # If not set and Assets.car exists, defaults to "appicon"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - .task
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true EXTRA_TAGS=mcp
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# File Associations
# More information at: https://v3.wails.io/noit/done/yet
# Left empty on purpose: document types come from `go run ./apps/kira-space/tools/gendoctypes`
# (P332), which owns the kira:doctypes block in both Info plists. `common:update:build-assets`
# drops that block; rerun the generator after it.
fileAssociations:
